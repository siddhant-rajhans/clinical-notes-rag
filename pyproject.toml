[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-notes-rag"
version = "0.1.0"
description = "RAG over clinical notes with BioClinicalBERT, cross-encoder reranking, and grounding evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siddhant Rajhans", email = "sidjha88@gmail.com" }]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "faiss-cpu>=1.8.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "ragas>=0.2.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
clinical-rag = "clinical_rag.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
